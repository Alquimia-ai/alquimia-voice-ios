name: AlquimiaVoice
options:
  bundleIdPrefix: ai.alquimia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  AlquimiaVoice:
    type: application
    platform: iOS
    sources:
      - path: AlquimiaVoice
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Alquimia Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Alquimia Voice usa el micrófono para que puedas hablar con el agente.
        NSLocalNetworkUsageDescription: Alquimia Voice se conecta a un runtime de desarrollo en tu red local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Solo para desarrollo contra runtimes ws:// en la LAN. Quitar en release.
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Geist-Regular.otf
          - Geist-Medium.otf
          - Geist-SemiBold.otf
          - Geist-Bold.otf
          - GeistMono-Regular.otf
          - GeistMono-Medium.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.alquimia.voice
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  AlquimiaVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlquimiaVoiceTests
    dependencies:
      - target: AlquimiaVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.alquimia.voice.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AlquimiaVoice:
    build:
      targets:
        AlquimiaVoice: all
        AlquimiaVoiceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlquimiaVoiceTests
